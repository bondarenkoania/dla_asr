defaults:
  - train
  - override /datasets: librispeech_other
  - override /decoder: greedy
  - override /transforms/instance_transforms: finetune_other
  - override /lr_scheduler: warmup_inverse_sqrt
  - _self_

optimizer:
  lr: 1e-4

lr_scheduler:
  warmup_steps: 300

writer:
  run_name: conformer_medium_other

trainer:
  from_pretrained: ???
  n_epochs: 25
  epoch_len: 1000
  media_log_every_n_epochs: 5
  monitor: "min val_other_WER"
  monitor_decoder: Argmax
  save_period: 1
  save_last: True
