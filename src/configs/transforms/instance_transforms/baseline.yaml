defaults:
  - no_augs
  - _self_

train:
  audio: # name of the tensor on which we apply transform
    _target_: torchvision.transforms.v2.Compose
    transforms:
      - _target_: torchvision.transforms.v2.RandomApply
        p: 0.5
        transforms:
          - _target_: src.transforms.wav_augs.SpeedPerturbation
      - _target_: torchvision.transforms.v2.RandomApply
        p: 0.5
        transforms:
          - _target_: src.transforms.wav_augs.Gain
            min_gain_in_db: -6.0
            max_gain_in_db: 6.0
      - _target_: torchvision.transforms.v2.RandomApply
        p: 0.1
        transforms:
          - _target_: src.transforms.wav_augs.AddBackgroundNoise
            noise_dir: data/noises
            min_snr: 20.0

  spectrogram:
    _target_: torchvision.transforms.v2.Compose
    transforms:
      - _target_: torchvision.transforms.v2.RandomApply
        p: 0.5
        transforms:
          - _target_: torchaudio.transforms.FrequencyMasking
            freq_mask_param: 15
          - _target_: torchaudio.transforms.TimeMasking
            time_mask_param: 30
