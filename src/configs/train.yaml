defaults:
  - model: conformer_medium
  - writer: cometml
  - metrics: baseline
  - datasets: librispeech_train
  - dataloader: baseline
  - transforms: only_instance
  - decoder: greedy
  - lr_scheduler: warmup_inverse_sqrt
  - _self_
optimizer:
  _target_: torch.optim.AdamW
  lr: 3e-4
  betas: [0.9, 0.98]
  eps: 1.0e-9
  weight_decay: 1e-4
dataloader:
  batch_size: 16
writer:
  run_name: conformer_medium_clean
  log_checkpoints: True
loss_function:
  _target_: src.loss.CTCLossWrapper
text_encoder:
  _target_: src.text_encoder.CTCTextEncoder
trainer:
  log_step: 50
  media_log_every_n_epochs: 5
  n_epochs: 12
  epoch_len: null
  max_grad_norm: 5
  device_tensors: ["spectrogram", "text_encoded"]
  resume_from: null # null or checkpoint filename relative to this run's save directory
  device: cuda
  override: False # if True, will override the previous run with the same name
  monitor_decoder: null # auto-select if exactly one decoder is configured
  monitor: "min val_WER" # "off" or "max/min metric_name"
  save_period: 4 # checkpoint each save_period epochs
  save_last: False # overwrite model_last.pth instead of keeping every epoch
  early_stop: ${trainer.n_epochs} # epochs for early stopping
  save_dir: "saved"
  seed: 1
